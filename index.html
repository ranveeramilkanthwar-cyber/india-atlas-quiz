<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>India Atlas - Distance Cartography &amp; KM Guessing Game</title>
    <meta
      name="description"
      content="Explore India, estimate straight-line distances between cities with physics-based slider controls, and view real-world state boundaries on an authentic Leaflet map."
    />
    <link rel="icon" type="image/png" href="assets/images/city_pin_marker.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f6f4ef;
        font-family: 'Plus Jakarta Sans', 'DM Sans', system-ui, -apple-system,
          sans-serif;
      }
      #root {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      .leaflet-container {
        font-family: inherit;
        background-color: #f6f4ef;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="dist/bundle.js"></script>
  </body>
</html>
